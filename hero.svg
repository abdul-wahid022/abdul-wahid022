<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img" aria-label="Abdul Wahid - Cybersecurity Hero Banner">
<title>Abdul Wahid - Cybersecurity Hero Banner</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace; }

    /* Fade &amp; Scale Transitions for Morphing Layers */
    .morph-state-1 {
        animation: morphSeq1 9s ease-in-out infinite;
        transform-origin: 220px 240px;
    }
    .morph-state-2 {
        animation: morphSeq2 9s ease-in-out infinite;
        transform-origin: 220px 240px;
    }
    .morph-state-3 {
        animation: morphSeq3 9s ease-in-out infinite;
        transform-origin: 220px 240px;
    }

    @keyframes morphSeq1 {
        0%, 28% { opacity: 1; transform: scale(1); }
        33%, 95% { opacity: 0; transform: scale(0.92); }
        100% { opacity: 1; transform: scale(1); }
    }

    @keyframes morphSeq2 {
        0%, 28% { opacity: 0; transform: scale(0.92); }
        33%, 61% { opacity: 1; transform: scale(1); }
        66%, 100% { opacity: 0; transform: scale(0.92); }
    }

    @keyframes morphSeq3 {
        0%, 61% { opacity: 0; transform: scale(0.92); }
        66%, 95% { opacity: 1; transform: scale(1); }
        100% { opacity: 0; transform: scale(0.92); }
    }

    .pulse-glow {
        animation: pulseGlow 3s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
    }

    @keyframes pulseGlow {
        0%, 100% { opacity: 0.6; stroke-width: 1.5px; }
        50% { opacity: 1; stroke-width: 2.5px; }
    }

    @media (prefers-reduced-motion: reduce) {
        .morph-state-1 { opacity: 1 !important; transform: none !important; animation: none !important; }
        .morph-state-2, .morph-state-3 { display: none !important; }
    }
</style>

<defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#0D1117"/>
        <stop offset="100%" stop-color="#0A0D12"/>
    </linearGradient>

    <!-- Pinstripe Pattern -->
    <pattern id="pinstripe" width="12" height="12" patternUnits="userSpaceOnUse">
        <rect width="12" height="12" fill="url(#bgGrad)"/>
        <line x1="0" y1="0" x2="0" y2="12" stroke="#F0883E" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>

    <!-- Radial Glows -->
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#F0883E" stop-opacity="0.22"/>
        <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>

    <!-- Image Clip Path -->
    <clipPath id="circleClip">
        <circle cx="220" cy="240" r="140"/>
    </clipPath>
</defs>

<!-- Outer Container -->
<rect width="1000" height="480" rx="12" fill="url(#pinstripe)" stroke="#30363D" stroke-width="1.5"/>

<!-- LEFT SIDE: MORPHING VISUAL FRAME (38% AREA) -->
<g transform="translate(0, 0)">
    <circle cx="220" cy="240" r="170" fill="url(#amberGlow)"/>
    <circle cx="220" cy="240" r="145" fill="none" stroke="#F0883E" stroke-opacity="0.4" stroke-dasharray="4 6" class="pulse-glow"/>
    <circle cx="220" cy="240" r="141" fill="#161B22" stroke="#F0883E" stroke-width="1.8"/>

    <!-- State 1: Personal Identity Portrait -->
    <g class="morph-state-1">
        <image href="data:image/png;base64," x="80" y="100" width="280" height="280" clip-path="url(#circleClip)" preserveAspectRatio="xMidYMid slice"/>
        <text x="220" y="415" font-size="11" fill="#F0883E" font-weight="700" text-anchor="middle" letter-spacing="1">[01 // IDENTITY VERIFIED]</text>
    </g>

    <!-- State 2: Network Security Tree -->
    <g class="morph-state-2">
        <image href="data:image/png;base64," x="100" y="120" width="240" height="240" clip-path="url(#circleClip)" preserveAspectRatio="xMidYMid meet"/>
        <text x="220" y="415" font-size="11" fill="#F0883E" font-weight="700" text-anchor="middle" letter-spacing="1">[02 // NETWORK INFRASTRUCTURE]</text>
    </g>

    <!-- State 3: Digital Forensics Fingerprint -->
    <g class="morph-state-3">
        <image href="data:image/png;base64," x="100" y="120" width="240" height="240" clip-path="url(#circleClip)" preserveAspectRatio="xMidYMid meet"/>
        <text x="220" y="415" font-size="11" fill="#F0883E" font-weight="700" text-anchor="middle" letter-spacing="1">[03 // DFIR INVESTIGATION]</text>
    </g>
</g>

<!-- DIVIDER LINE -->
<line x1="420" y1="40" x2="420" y2="440" stroke="#30363D" stroke-width="1.2" stroke-dasharray="4 4"/>

<!-- RIGHT SIDE: TERMINAL INFORMATION PANEL (62% AREA) -->
<g transform="translate(450, 45)">
    <!-- Terminal Header -->
    <text x="0" y="20" font-size="12" fill="#F0883E" font-weight="700" letter-spacing="1.5">SYSTEM.INFO &#8212; INITIALIZED</text>
    <text x="0" y="55" font-size="28" fill="#F8FAFC" font-weight="700">Abdul Wahid</text>
    <text x="0" y="80" font-size="14" fill="#94A3B8" font-weight="500">Cybersecurity &#183; Network Defense &#183; DFIR</text>

    <line x1="0" y1="105" x2="510" y2="105" stroke="#30363D" stroke-width="1"/>

    <!-- Specializations -->
    <text x="0" y="135" font-size="11" fill="#F0883E" font-weight="700" letter-spacing="1.2">SPECIALIZATIONS</text>
    <text x="0" y="158" font-size="14" fill="#F8FAFC" font-weight="500">SOC / SIEM &#183; Network Security &#183; Digital Forensics</text>

    <!-- Toolkit -->
    <text x="0" y="200" font-size="11" fill="#F0883E" font-weight="700" letter-spacing="1.2">TOOLKIT</text>
    <text x="0" y="223" font-size="14" fill="#F8FAFC" font-weight="500">Wazuh &#183; Suricata &#183; Zeek &#183; Cisco &#183; Autopsy &#183; YARA</text>

    <!-- Current Learning -->
    <text x="0" y="265" font-size="11" fill="#D29922" font-weight="700" letter-spacing="1.2">CURRENT LEARNING</text>
    <text x="0" y="288" font-size="14" fill="#F8FAFC" font-weight="500">CCNA / CND Trained &#183; CHFI In Progress</text>

    <line x1="0" y1="320" x2="510" y2="320" stroke="#30363D" stroke-width="1"/>

    <!-- Footer Stats -->
    <text x="0" y="352" font-size="12" fill="#94A3B8" font-weight="500">20 Repositories &#183; Security Labs &amp; Engineering Projects</text>
</g>

<!-- Outer Border Glow Accent -->
<rect width="998" height="478" x="1" y="1" rx="12" fill="none" stroke="#F0883E" stroke-opacity="0.25" stroke-width="1"/>
</svg>