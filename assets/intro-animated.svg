<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 352" width="1100" height="352" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">About Abdul Wahid</title>
<desc id="d">About: I design, test and document hands-on security lab environments covering offensive techniques and defensive controls. Each repository holds the configs, reports and evidence. Focus: SOC and SIEM, network defense, digital forensics and DFIR. Also: malware analysis, threat intelligence and OSINT, Linux, Bash, C++ and x86 assembly. Background: BS Cyber Security at Air University Multan; SOC intern at Secure Dev Labs; CTI and OSINT intern at The Arzens. Scope: isolated lab environments; EC-Council CND, CEH and CHFI coursework; CCNA-level networking.</desc>
